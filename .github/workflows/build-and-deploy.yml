name: 아기로그 가족 앱 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare iPhone web app
        run: |
          test -s AgilogFamily.zip
          test -s firebase-config.js
          mkdir -p source
          unzip -q AgilogFamily.zip -d source
          test -s source/web/index.html
          cp firebase-config.js source/web/firebase-config.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/web

  deploy:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy iPhone web app
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Android app
        run: |
          test -s AgilogFamily.zip
          test -s google-services.json
          mkdir -p source
          unzip -q AgilogFamily.zip -d source
          test -s source/android/app/build.gradle
          cp google-services.json source/android/app/google-services.json

      - name: Fix Firebase Timestamp imports
        run: |
          sed -i 's/com\.google\.firebase\.firestore\.Timestamp/com.google.firebase.Timestamp/g' source/android/app/src/main/java/com/agilog/local/*.java

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: source/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AgilogFamily-APK
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
